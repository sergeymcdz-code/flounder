/* ===== Токены SportGate D04-1 (значения из tokens.css, без новых) ===== */
.fl {
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --font-heading: Oswald, 'Golos Text', sans-serif;
  --color-page:#eef0ee; --color-surface:#ffffff; --color-surface-muted:#f3f5f3;
  --color-text:#182126; --color-text-muted:#52616a; --color-border:#cbd2d3; --color-border-strong:#7d898f;
  --color-primary:#0069b4; --color-primary-hover:#00548f; --color-primary-soft:#e5f3ff; --color-on-primary:#ffffff;
  --color-accent:#a74300; --color-accent-soft:#fff0df;
  --color-danger:#a62132; --color-danger-soft:#ffedf0;
  --color-success:#17603d; --color-success-soft:#e7f4eb;
  --color-warning:#815400; --color-warning-soft:#fff3cc;
  --surface-page:var(--color-page); --surface-1:var(--color-surface); --surface-2:var(--color-surface-muted); --surface-3:var(--color-primary-soft);
  --border-subtle:var(--color-border); --border-strong:var(--color-border-strong); --border-rule:var(--color-text); --border-width-rule:3px;
  --shadow-pop:0 4px 12px rgb(24 33 38 / .12); --shadow-sticky:0 1px 0 var(--color-border);
  --radius-sm:3px; --radius-md:5px; --radius-lg:8px; --radius-pill:999px;
  --control-h:44px; --control-h-sm:36px; --control-h-lg:56px; --header-h:56px; --sidebar-w:232px; --content-max:1280px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --font-size-12:12px; --font-size-14:14px; --font-size-16:16px; --font-size-18:18px; --font-size-20:20px; --font-size-24:24px; --font-size-28:28px; --font-size-32:32px;
  --text-2xl:40px; --text-display:64px; --numeric-variant: tabular-nums lining-nums;
  --status-live:var(--color-danger); --status-live-soft:var(--color-danger-soft);
  font-family: var(--font-body); color: var(--color-text); background: var(--color-page); font-size: 16px; line-height: 1.5;
}
.fl.dark {
  --color-page:#11181d; --color-surface:#182126; --color-surface-muted:#222e35; --color-text:#f5f7f5; --color-text-muted:#bfcdd2;
  --color-border:#52616a; --color-border-strong:#96a5ac; --color-primary:#72c7ff; --color-primary-hover:#a9ddff; --color-primary-soft:#17364d; --color-on-primary:#182126;
  --color-accent:#ffb56b; --color-accent-soft:#3c2917; --color-danger:#ffb4bf; --color-danger-soft:#3d2028; --color-success:#96ddb3; --color-success-soft:#183327;
  --color-warning:#ffd166; --color-warning-soft:#352c17; --shadow-pop:0 4px 16px rgb(0 0 0 / .5);
}

/* ===== Страница-галерея (не часть продукта) ===== */
body { margin: 0; background: #d8dcd9; font-family: 'Golos Text', system-ui, sans-serif; color: #182126; }
.gallery { padding: 32px; }
.gallery h1 { font: 600 28px Oswald, sans-serif; margin: 0 0 8px; }
.gallery > p { max-width: 900px; margin: 0 0 24px; color: #52616a; font-size: 14px; }
.row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 40px; }
.frame { flex: 0 0 auto; }
.frame > figcaption { font: 600 13px/1.4 'Golos Text', sans-serif; color: #52616a; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
.screen { position: relative; overflow: hidden; box-shadow: 0 8px 32px rgb(0 0 0 / .18); border-radius: 4px; }
.screen.w375 { width: 375px; }
.screen.w1366 { width: 1366px; }
.fl * { box-sizing: border-box; }
.fl h1, .fl h2, .fl h3 { font-family: var(--font-heading); font-weight: 600; margin: 0; line-height: 1.2; }
.fl p { margin: 0; }
.fl a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: var(--numeric-variant); }

/* ===== Общие компоненты D04-1 (визуальный эквивалент classes fl-*) ===== */
.header { display:flex; align-items:center; gap:var(--space-4); height:var(--header-h); padding:0 var(--space-4); background:var(--surface-1); border-bottom:var(--border-width-rule) solid var(--border-rule); }
.w1366 .header { padding:0 var(--space-8); gap:var(--space-6); }
.brand { display:inline-flex; align-items:center; gap:10px; font:600 20px var(--font-heading); }
.brand i { display:grid; place-items:center; width:32px; height:32px; border-radius:6px; background:var(--color-text); color:var(--color-surface); font:700 18px var(--font-heading); font-style:normal; }
.dark .brand i { background:var(--color-text); color:var(--color-page); }
.hctx { font-size:var(--font-size-14); color:var(--color-text-muted); line-height:1.3; min-width:0; }
.hctx strong { display:block; color:var(--color-text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hnav { display:flex; gap:var(--space-5); font-size:var(--font-size-14); font-weight:600; color:var(--color-text-muted); }
.hnav a { display:inline-flex; align-items:center; min-height:44px; border-bottom:3px solid transparent; }
.hnav a.on { color:var(--color-text); border-color:var(--border-rule); }
.hright { margin-left:auto; display:flex; align-items:center; gap:var(--space-2); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:var(--control-h); min-width:44px; padding:10px var(--space-4); border:1px solid var(--border-strong); border-radius:var(--radius-sm); background:var(--surface-1); color:var(--color-primary); font:600 var(--font-size-14) var(--font-body); white-space:nowrap; }
.btn.primary { background:var(--color-primary); color:var(--color-on-primary); border-color:var(--color-primary); }
.btn.ghost { background:transparent; border-color:transparent; }
.btn.danger { background:var(--color-danger-soft); color:var(--color-danger); border-color:var(--color-danger); }
