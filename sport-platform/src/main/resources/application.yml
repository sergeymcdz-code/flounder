spring:
  config:
    import: optional:file:.env[.properties]
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  application:
    name: sport-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sport_platform}
    username: ${SPRING_DATASOURCE_USERNAME:sport_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sport_pass}
  docker:
    compose:
      enabled: false

  threads:
    virtual:
      enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sport_platform}
    user: ${SPRING_DATASOURCE_USERNAME:sport_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sport_pass}

  # Restore Redis/Kafka when the event-driven layer is introduced.

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

    env:
      enabled: false

    configprops:
      enabled: false

    metrics:
      enabled: false

    prometheus:
      enabled: false

  observations:
    annotations:
      enabled: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

app:
  auth:
    login:
      max-failures: ${APP_AUTH_LOGIN_MAX_FAILURES:5}
      window: ${APP_AUTH_LOGIN_WINDOW:PT15M}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  files:
    provider: ${APP_FILES_PROVIDER:local}
    local-dir: ${FILES_STORAGE_DIR:./data/files}
    encryption-key: ${APP_FILES_ENCRYPTION_KEY:}
    s3:
      endpoint: ${APP_FILES_S3_ENDPOINT:}
      bucket: ${APP_FILES_S3_BUCKET:}
      region: ${APP_FILES_S3_REGION:ru-1}
      access-key: ${APP_FILES_S3_ACCESS_KEY:}
      secret-key: ${APP_FILES_S3_SECRET_KEY:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    security: ${MAIL_SECURITY:auto}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@localhost}
    enabled: ${MAIL_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: "sport-platform"
      access-token-ttl: ${app.jwt.access-ttl:PT2H}
  payments:
    provider: ${APP_PAYMENTS_PROVIDER:MANUAL}
    yookassa:
      base-url: https://api.yookassa.ru/v3
      shop-id: ${YOOKASSA_SHOP_ID:}
      secret-key: ${YOOKASSA_SECRET_KEY:}
      return-url: ${YOOKASSA_RETURN_URL:http://localhost:3000/payment-return}