spring:
  config:
    import: optional:file:.env[.properties]
  
  application:
    name: sport-platform
  datasource:
    url: jdbc:postgresql://localhost:5433/sport_platform
    username: sport_user
    password: sport_pass
  docker:
    compose:
      enabled: false

  threads:
    virtual:
      enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5433/sport_platform
    user: sport_user
    password: sport_pass

  data:
    redis:
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

    env:
      enabled: false

    configprops:
      enabled: false

    metrics:
      enabled: false

    prometheus:
      enabled: false

  observations:
    annotations:
      enabled: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: "sport-platform"
      access-token-ttl: PT2H
  payments:
    provider: MANUAL
    yookassa:
      base-url: https://api.yookassa.ru/v3
      shop-id: ${YOOKASSA_SHOP_ID:}
      secret-key: ${YOOKASSA_SECRET_KEY:}
      return-url: ${YOOKASSA_RETURN_URL:http://localhost:3000/payment-return}