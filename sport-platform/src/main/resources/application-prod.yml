spring:
  config:
    activate:
      on-profile: prod

  # Redis and Kafka are not used on the demo stand (and not deployed by infra/compose.prod.yaml).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1500000
      keepalive-time: 300000
      leak-detection-threshold: 20000

  flyway:
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  modulith:
    events:
      completion-mode: delete

  docker:
    compose:
      enabled: false

server:
  tomcat:
    threads:
      max: 64
      min-spare: 4
    accept-count: 100
    max-connections: 2000
    keep-alive-timeout: 30s
  forward-headers-strategy: native  # behind Caddy: trust X-Forwarded-* for correct https links

management:
  tracing:
    enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs   # JSON lines to stdout (collected by docker logs)
  level:
    root: INFO
    com.acme.sportplatform: INFO
    org.hibernate.SQL: WARN

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  payments:
    provider: ${APP_PAYMENTS_PROVIDER:MANUAL}

# Optional error reporting: an empty DSN disables transport.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
