<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="ru">
<head><meta charset="UTF-8" /><title th:text="${protocol.header.title}">Протокол</title><style type="text/css">
@page { size: A4 portrait; margin: 15mm;
  @top-center { content: element(header); }
  @bottom-left { content: element(footer); }
  @bottom-right { content: "Страница " counter(page) " из " counter(pages); font-family: "Noto Sans"; font-size: 8pt; }
}
body { font-family: "Noto Sans"; font-size: 10pt; color: #15242c; }
.header { position: running(header); font-size: 9pt; text-align: left; }
.footer { position: running(footer); font-size: 8pt; }
h1 { font-size: 14pt; margin: 0 0 4mm; }
h2 { font-size: 12pt; margin: 5mm 0 2mm; page-break-after: avoid; }
h3 { font-size: 10pt; margin: 3mm 0 1mm; page-break-after: avoid; }
table { border-collapse: collapse; width: 100%; table-layout: fixed; -fs-table-paginate: paginate; }
th, td { border: 0.2mm solid #bbc8ce; padding: 1.5mm; vertical-align: top; word-wrap: break-word; }
th { background-color: #eef3f5; text-align: left; font-size: 9pt; }
.heat { page-break-inside: avoid; margin-bottom: 4mm; }
.number { width: 8%; } .name { width: 30%; } .year { width: 9%; } .club { width: 23%; } .time { width: 16%; } .status { width: 14%; }
.withdrawn { color: #586b76; } .marker { font-size: 8pt; } .muted { color: #586b76; }
</style></head>
<body>
<div class="header"><strong th:text="${protocol.header.title}">Соревнование</strong><br />
<span th:text="${protocol.header.date}">Дата</span> · <span th:text="${protocol.header.venue}">Площадка</span><br />
<span th:text="${protocol.header.organization}">Организация</span></div>
<div class="footer">Сформировано: <span th:text="${protocol.header.generatedAt}">Время генерации</span></div>
<h1>Стартовый протокол</h1>
<p th:if="${protocol.disciplines.isEmpty()}">Заплывы ещё не опубликованы или не сформированы.</p>
<section th:each="discipline : ${protocol.disciplines}">
<h2>Вид № <span th:text="${discipline.number}">1</span>. <span th:text="${discipline.name}">Название</span></h2>
<p class="muted" th:text="${discipline.session}">Сессия</p>
<div class="heat" th:each="heat : ${discipline.heats}">
<h3>Заплыв <span th:text="${heat.number}">1</span> — <span th:text="${heat.startsAt}">10:00</span>
<span th:if="${!heat.ageGroup.isEmpty()}" th:text="${' · ' + heat.ageGroup}">Группа</span></h3>
<table><thead><tr><th class="number">Дор.</th><th class="name">Фамилия Имя</th><th class="year">Год</th><th class="club">Клуб</th><th class="time">Заявочное время</th><th class="status">Время старта</th></tr></thead>
<tbody><tr th:each="row : ${heat.rows}" th:class="${row.withdrawn ? 'withdrawn' : ''}">
<td th:text="${row.lane}">1</td><td><span th:text="${row.athlete}">Участник</span><br th:if="${row.withdrawn}" /><span th:if="${row.withdrawn}" class="marker">Снят</span></td>
<td th:text="${row.year}">2014</td><td th:text="${row.club}">Клуб</td><td th:text="${row.seed}">NT</td><td th:text="${heat.startsAt}">10:00</td>
</tr></tbody></table>
</div></section></body></html>
