spring:
  config:
    activate:
      on-profile: test

  docker:
    compose:
      enabled: false

  flyway:
    enabled: true
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

logging:
  level:
    root: INFO

app:
  mail:
    worker-enabled: false
    reminders-cron: "-"
  security:
    jwt:
      secret: "change-me-change-me-change-me-change-me-change-me-please"
      issuer: "sport-platform-test"
      access-token-ttl: ${app.jwt.access-ttl:PT2H}

events:
  lifecycle:
    cron: "-"
