services:
  postgres:
    image: postgres:16
    container_name: sport-platform-postgres
    environment:
      POSTGRES_DB: sport_platform
      POSTGRES_USER: sport_user
      POSTGRES_PASSWORD: sport_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sport_user -d sport_platform" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Restore Redis/Kafka when the event-driven layer is introduced.

volumes:
  postgres_data:
