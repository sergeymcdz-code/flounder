<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('flounder.theme'); } catch {}
        if (saved !== 'light' && saved !== 'dark') saved = null;
        const path = location.pathname;
        const publicPage = /^\/e\/[^/]+(?:\/|$)/.test(path);
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = publicPage
          ? saved ?? (systemDark || /\/(live|results)\/?$/.test(path) ? 'dark' : 'light')
          : 'light';
      })();
    </script>
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/sportgate-192.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182126" />
    <meta
      name="description"
      content="SportGate — расписание, заплывы и результаты соревнований по плаванию."
    />
    <link rel="apple-touch-icon" title="SportGate" href="/icons/sportgate-192.png" />
    <title>SportGate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
