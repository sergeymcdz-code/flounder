# Manual deployment. Configure these secrets in the production environment:
# SSH_HOST, SSH_USER, SSH_KEY (private key as is) or SSH_KEY_B64 (the same key, `base64 -w0` — one line,
# safe to copy from any terminal; takes precedence), SSH_HOST_KEY (one trusted public host key, type + base64),
# SSH_HOST_KEY_FINGERPRINT (SHA256:... obtained via the provider console).
name: Deploy demo stand

on:
  workflow_dispatch:
    inputs:
      app_dir:
        description: Каталог репозитория на сервере (абсолютный путь без пробелов)
        required: true
        default: /home/deploy/flounder
      branch:
        description: Ветка для развёртывания
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Подготовить и проверить SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_HOST_KEY_FINGERPRINT: ${{ secrets.SSH_HOST_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 2
          if [[ -n "${SSH_KEY_B64:-}" ]]; then
            clean="$(printf '%s' "$SSH_KEY_B64" | tr -d ' \r\n')"
            printf '%s' "$clean" | base64 -d >/dev/null 2>&1 || { echo 'SSH_KEY_B64 не декодируется.' >&2; exit 2; }
            if printf '%s' "$clean" | base64 -d 2>/dev/null | grep -aq 'PRIVATE KEY-----'; then
              # Whole PEM file encoded with `base64 -w0`.
              SSH_KEY="$(printf '%s' "$clean" | base64 -d | tr -d '\0')"
            else
              # Only the PEM body was pasted (lines between BEGIN/END): restore the armour.
              SSH_KEY="$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----' "$(printf '%s' "$clean" | fold -w 70)")"
            fi
          fi
          [[ -n "$SSH_KEY" && -n "$SSH_HOST_KEY_FINGERPRINT" ]] || exit 2
          [[ "$SSH_KEY" == *"PRIVATE KEY-----"* ]] || { echo 'SSH_KEY не похож на приватный ключ OpenSSH.' >&2; exit 2; }
          [[ "$SSH_HOST_KEY" != *$'\n'* && "$SSH_HOST_KEY" =~ ^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)\ [A-Za-z0-9+/=]+$ ]] || exit 2
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/host_key.pub
          actual="$(ssh-keygen -lf ~/.ssh/host_key.pub -E sha256 | awk '{print $2}')"
          [[ "$actual" == "$SSH_HOST_KEY_FINGERPRINT" ]] || { echo 'Отпечаток ключа сервера не совпадает.' >&2; exit 1; }
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Запустить deploy.sh на сервере
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ inputs.app_dir }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 2
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 2
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]] || { echo 'Недопустимый каталог.' >&2; exit 2; }
          [[ "$BRANCH" =~ ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$ ]] || exit 2
          git check-ref-format --branch "$BRANCH" >/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && DEPLOY_BRANCH='$BRANCH' ./infra/deploy.sh"

      - name: Удалить временные ключи
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/host_key.pub ~/.ssh/known_hosts
