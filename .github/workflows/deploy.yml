# Manual deploy of the demo stand: runs infra/deploy.sh on the server over SSH.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST  - server IP or hostname
#   SSH_USER  - linux user that owns /opt/flounder and is in the docker group
#   SSH_KEY   - private key (OpenSSH format) whose public part is in ~/.ssh/authorized_keys on the server
# If you prefer not to give GitHub SSH access, skip this workflow and run ./infra/deploy.sh
# on the server by hand (see docs/runbook-demo.md, section "Обновление").
name: Deploy demo stand

on:
  workflow_dispatch:
    inputs:
      app_dir:
        description: Repository directory on the server
        required: true
        default: /opt/flounder
      branch:
        description: Branch to deploy
        required: true
        default: main

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy.sh on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ inputs.app_dir }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && DEPLOY_BRANCH='$BRANCH' ./infra/deploy.sh"
