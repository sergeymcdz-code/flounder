name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sport-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub-hosted Ubuntu already provides Docker for Testcontainers.
      - run: docker info
      - run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sport-platform/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sport-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: python3 ../../infra/tests/csp-test.py dist/index.html
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('sport-platform/frontend/package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run QA06 with API mocks
        run: npm run test:qa06 -- --workers=2
      - name: Upload QA06 report and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            sport-platform/frontend/playwright-report/
            sport-platform/frontend/work/qa06-playwright/
          retention-days: 7

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/demo/package-lock.json
      - run: npm ci
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y age shellcheck python3-yaml
      - run: shellcheck infra/*.sh infra/tests/*.sh
      - run: bash infra/tests/workflow-test.sh
      - run: bash infra/tests/caddy-test.sh
      - run: bash infra/tests/staging-test.sh
      - run: bash infra/tests/maintenance-test.sh
      - run: bash infra/tests/compose-config-test.sh
