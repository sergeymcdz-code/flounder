version: 2
# Политика: security-обновления приходят сразу (их Dependabot создаёт независимо от расписания);
# обычные обновления — раз в месяц, одним сгруппированным PR на экосистему, только minor/patch.
# Major-версии (TypeScript 7, PDFBox 3, Testcontainers 2 и т. п.) игнорируются — их поднимаем отдельной задачей.
updates:
  - package-ecosystem: "maven"
    directory: "/sport-platform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/sport-platform/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/scripts/demo"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      demo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
