# Production/demo stack for Flounder (T09).
# Run from the repository root:
#   docker compose -f infra/compose.prod.yaml --env-file infra/.env.prod up -d --build
# Variables (${...}) are read from infra/.env.prod, see infra/.env.prod.example.

# Memory budget (4 GB): OS/Docker ~0.5 + api 1.66 + postgres 0.64 + caddy/web 0.25 GB.
# The remainder is available for the page cache and image builds.
name: flounder

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.14
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=300
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    shm_size: 256m
    mem_limit: 640m
    stop_grace_period: 30s
    container_name: flounder-postgres
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sport_platform}
      POSTGRES_USER: ${POSTGRES_USER:-sport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in infra/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sport_user} -d ${POSTGRES_DB:-sport_platform}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    # No published ports: the database is reachable only from the compose network.

  api:
    build:
      context: ../sport-platform
      dockerfile: Dockerfile
    image: flounder-api:latest
    mem_limit: 1664m
    memswap_limit: 1664m
    stop_grace_period: 40s
    container_name: flounder-api
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sport_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sport_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in infra/.env.prod}
      APP_FILES_ENCRYPTION_KEY: ${APP_FILES_ENCRYPTION_KEY:?APP_FILES_ENCRYPTION_KEY is required in infra/.env.prod (openssl rand -base64 32)}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://${DOMAIN}}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://${DOMAIN}}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURITY: ${MAIL_SECURITY:-auto}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      APP_PAYMENTS_PROVIDER: ${APP_PAYMENTS_PROVIDER:-MANUAL}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      FILES_STORAGE_DIR: ${FILES_STORAGE_DIR:-/data/files}
      DEMO_SEED: ${DEMO_SEED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      TZ: ${TZ:-Europe/Samara}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30
        -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
        -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m
        -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom
    volumes:
      - flounder_files:${FILES_STORAGE_DIR:-/data/files}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging: *default-logging

  web:
    build:
      context: ../sport-platform/frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines this at build time; API is served from the same origin via Caddy.
        VITE_API_BASE_URL: https://${DOMAIN:?DOMAIN is required in infra/.env.prod}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    image: flounder-web:latest
    mem_limit: 128m
    container_name: flounder-web
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  caddy:
    image: caddy:2.10.2
    mem_limit: 128m
    container_name: flounder-caddy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required in infra/.env.prod}
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy-Report-Only}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:-staging}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    depends_on:
      - api
      - web
    logging: *default-logging

volumes:
  flounder_files:
    name: flounder_files
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    name: flounder_edge
